name: Workspace checks

on:
  push:
    paths:
      - "apps/**"
      - "features/**"
      - "internal/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
      - "knip.json"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - "apps/**"
      - "features/**"
      - "internal/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
      - "knip.json"
      - ".github/workflows/**"
      - ".github/actions/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
